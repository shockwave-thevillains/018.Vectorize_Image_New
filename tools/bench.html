<!doctype html>
<meta charset="utf-8">
<script src="../worker.js"></script>
<script type="module">
import { buildSVG, defaultHidden } from '../export.js';

const BASE = { mode: 'color', polyFit: true, subpixel: true, bgKey: null, keyTol: 30, upscale: 4, maxColors: 0, colorMerge: 10, smooth: 0.8, minArea: 6, corner: 70, whiteMode: 'outer', whiteTol: 10, maxWorkPixels: 4096 * 4096, silTones: 'gray', silThreshold: 128, cavity: 'white', gradColors: 64, lineStrokes: true, clean: true, rough: 2, straighten: true };

// Kerataan kurva: total belokan absolut per 100 px sumber, dan jumlah titik balik
// (pergantian arah lengkung) per 100 px.
function wiggle(res) {
  const s = res.scale;
  let turn = 0, len = 0, infl = 0;
  for (const ch of res.chains) {
    const pts = [];
    const p = ch.p, c = ch.c;
    let x = p[0], y = p[1], k = 2;
    pts.push(x, y);
    for (const cmd of c) {
      if (cmd === 0) { x = p[k]; y = p[k + 1]; k += 2; pts.push(x, y); }
      else {
        const x1 = p[k], y1 = p[k + 1], x2 = p[k + 2], y2 = p[k + 3], x3 = p[k + 4], y3 = p[k + 5];
        for (let i = 1; i <= 8; i++) {
          const t = i / 8, u = 1 - t;
          pts.push(u * u * u * x + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3, u * u * u * y + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3);
        }
        x = x3; y = y3; k += 6;
      }
    }
    // Sampel ulang tiap ~1 px sumber.
    const R = [pts[0], pts[1]];
    let acc = 0;
    for (let i = 2; i < pts.length; i += 2) {
      const d = Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
      len += d / s; acc += d;
      if (acc >= s) { R.push(pts[i], pts[i + 1]); acc = 0; }
    }
    let prevA = null, prevSign = 0;
    for (let i = 2; i + 2 < R.length; i += 2) {
      const a1 = Math.atan2(R[i + 1] - R[i - 1], R[i] - R[i - 2]);
      const a2 = Math.atan2(R[i + 3] - R[i + 1], R[i + 2] - R[i]);
      let d = a2 - a1;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      turn += Math.abs(d);
      const sg = Math.abs(d) < 0.02 ? 0 : Math.sign(d);
      if (sg && prevSign && sg !== prevSign) infl++;
      if (sg) prevSign = sg;
      prevA = a2;
    }
  }
  return { turn100: (turn / Math.max(1, len)) * 100, infl100: (infl / Math.max(1, len)) * 100, lenPx: len };
}

window.bench = async (img, opts) => {
  const o = Object.assign({}, BASE, opts);
  const blob = await (await fetch('../test-images/' + img)).blob();
  const t0 = performance.now();
  const res = await vectorize(blob, o, () => {});
  const ms = performance.now() - t0;
  const W = res.srcW, H = res.srcH;
  const svg = buildSVG(res, { size: { w: W, h: H }, stacking: 'stacked', gapFill: true, gapWidth: 1.5, hidden: defaultHidden(res) });
  const bg = o.bgKey === 'magenta' ? '#ff00ff' : o.bgKey === 'white' ? '#ffffff' : null;
  const draw = async (src, isSvg) => {
    const c = new OffscreenCanvas(W, H), g = c.getContext('2d');
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, W, H); }
    const bmp = isSvg ? await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' })); }) : await createImageBitmap(src);
    g.drawImage(bmp, 0, 0, W, H);
    return g.getImageData(0, 0, W, H).data;
  };
  const A = await draw(blob, false), B = await draw(svg, true);
  let sum = 0, bad = 0, eSum = 0, eN = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const p = (y * W + x) * 4;
    const d = Math.abs(A[p] - B[p]) + Math.abs(A[p + 1] - B[p + 1]) + Math.abs(A[p + 2] - B[p + 2]);
    sum += d;
    if (d > 90) bad++;
    if (x > 0 && y > 0 && x < W - 1 && y < H - 1) {
      let gr = 0;
      for (let c = 0; c < 3; c++) gr += Math.abs(A[p + 4 + c] - A[p - 4 + c]) + Math.abs(A[p + W * 4 + c] - A[p - W * 4 + c]);
      if (gr > 90) { eSum += d; eN++; }
    }
  }
  const vis = defaultHidden(res).reduce((n, h) => n + (h ? 0 : 1), 0);
  const w = wiggle(res);
  return { err: +(sum / (W * H * 3)).toFixed(2), edgeErr: +(eSum / Math.max(1, eN) / 3).toFixed(2), bad: +(100 * bad / (W * H)).toFixed(3), colors: res.palette.length, shapes: vis, nodes: res.nodes, turn100: +w.turn100.toFixed(1), infl100: +w.infl100.toFixed(2), sec: +(ms / 1000).toFixed(1), svg };
};
window.ready = true;
</script>
